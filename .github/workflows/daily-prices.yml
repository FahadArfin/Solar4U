name: Daily retailer prices
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-price-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore observation branch
        shell: bash
        run: |
          mkdir -p /tmp/solar4u-prices
          if git ls-remote --exit-code origin refs/heads/price-data >/dev/null 2>&1; then
            git fetch origin price-data
            git worktree add /tmp/solar4u-prices/data origin/price-data
          else
            mkdir -p /tmp/solar4u-prices/data
            git -C /tmp/solar4u-prices/data init -b price-data
          fi
      - name: Read published retailer catalogs
        id: collect
        continue-on-error: true
        env:
          PRICE_DATA_DIR: /tmp/solar4u-prices/data
        run: node scripts/collect-prices.mjs
      - name: Persist daily observations and source failures
        shell: bash
        run: |
          cd /tmp/solar4u-prices/data
          git config user.name 'solar4u-price-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json history runs
          if ! git diff --cached --quiet; then
            git commit -m "Record retailer observations $(date -u +%F)"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:price-data
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Flag a collection-wide failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
